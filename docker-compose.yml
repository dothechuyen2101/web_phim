# Postgres cho môi trường dev. Chạy: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phim
      POSTGRES_PASSWORD: phim
      POSTGRES_DB: web_phim
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phim -d web_phim"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
